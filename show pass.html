<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>show pass</title>
</head>
<body>
<div>
    <div>
        <input type="text" placeholder="username">
    </div>
    <div>
        <input id="password" type="password" placeholder="password">
        <button onclick="showpass(this)">Show password</button>
    </div>
</div>
<script>
    function showpass(btn) {
        let input = document.getElementById('password');
        if (input.type === 'password') {
            input.type = 'text';
            btn.innerText = "Hide"
        }
        else{
            input.type = 'password';
            btn.innerText = "Show"
        }
    }
</script>
</body>
</html>
